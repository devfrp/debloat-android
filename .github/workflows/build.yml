# Build multi-plateforme + publication des paquets sur la GitHub Release du depot.
# Declencheurs : lancement manuel (workflow_dispatch) et pousse de tags v*.
name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Pre-requis (Tk pour PyInstaller)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk

      - name: PyInstaller (GUI, un seul binaire)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          pyinstaller --onefile --windowed --name debloat-android debloat_gui.py

      - name: Assembler l'AppDir
        run: |
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications"
          install -m 0755 dist/debloat-android "$APPDIR/usr/bin/debloat-android"
          {
            echo '[Desktop Entry]'
            echo 'Type=Application'
            echo 'Name=Debloat Android'
            echo 'Comment=Retrait des apps systeme d un smartphone Android, via ADB (sans root)'
            echo 'Exec=AppRun'
            echo 'Icon=debloat-android'
            echo 'Categories=Utility;Development;'
          } > "$APPDIR/usr/share/applications/debloat-android.desktop"
          cp "$APPDIR/usr/share/applications/debloat-android.desktop" \
            "$APPDIR/debloat-android.desktop"
          {
            echo '#!/bin/sh'
            echo 'HERE="$(dirname "$(readlink -f "$0")")"'
            echo 'exec "$HERE/usr/bin/debloat-android" "$@"'
          } > "$APPDIR/AppRun"
          chmod 0755 "$APPDIR/AppRun"
          python3 tools/make_icon.py "$APPDIR/debloat-android.png"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          cp "$APPDIR/debloat-android.png" \
            "$APPDIR/usr/share/icons/hicolor/128x128/apps/debloat-android.png"

      - name: appimagetool -> .AppImage
        run: |
          cd build
          curl -fsSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          ./appimagetool-x86_64.AppImage AppDir debloat-android-linux.AppImage
          test -f debloat-android-linux.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/debloat-android-linux.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PyInstaller (GUI + CLI)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pyinstaller --onefile --windowed --name DebloatAndroid debloat_gui.py
          pyinstaller --onefile --name debloat-cli debloat_cli.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DebloatAndroid.exe
            dist/debloat-cli.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: PyInstaller (.app)
        run: |
          python3 -m pip install --break-system-packages pyinstaller
          python3 -m PyInstaller --windowed --name DebloatAndroid debloat_gui.py

      - name: Archiver le .app
        run: |
          ditto -c -k --keepParent dist/DebloatAndroid.app dist/debloat-android-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/debloat-android-macos.zip
          if-no-files-found: error

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth status
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="manual-$(date -u +%Y%m%d-%H%M%S)"
          fi
          {
            echo '- Linux : debloat-android-linux.AppImage (GUI)'
            echo '- Windows : DebloatAndroid.exe (GUI) + debloat-cli.exe (CLI)'
            echo '- macOS : debloat-android-macos.zip (GUI, .app non signe)'
            echo ''
            echo 'Les platform-tools ADB sont requis sur la machine hote.'
          } > release-notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Debloat Android $TAG" \
            --notes-file release-notes.md \
            debloat-android-linux.AppImage DebloatAndroid.exe debloat-cli.exe debloat-android-macos.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
